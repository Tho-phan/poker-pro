name: CI

# Gate the frontend on every push to a shared branch and on PRs into main.
on:
  push:
    branches: [main, dev-paul]
  pull_request:
    branches: [main]

# If new commits arrive on the same ref, cancel the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Next 16 requires Node >= 20.9; test the two active LTS lines.
        node: ["20.x", "22.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # `next build` runs the authoritative TypeScript check (the standalone
      # tsc --noEmit needs Next's generated types, which aren't committed).
      - name: Build
        run: npm run build
